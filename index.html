<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 45px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        .form-container {
            padding: 40px 35px;
        }

        .tab-navigation {
            display: flex;
            gap: 0;
            margin-bottom: 35px;
            border-bottom: 3px solid #f0f0f0;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: #999;
            border-bottom: 4px solid transparent;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn.active {
            color: #2a5298;
            border-bottom-color: #2a5298;
        }

        .tab-btn:hover {
            color: #2a5298;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background-color: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #2a5298;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
        }

        input::placeholder {
            color: #aaa;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2a5298;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            text-transform: none;
            letter-spacing: normal;
            font-size: 14px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option label {
            margin: 0;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            text-transform: none;
            letter-spacing: normal;
            font-size: 14px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .forgot-password a {
            color: #2a5298;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #1e3c72;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(42, 82, 152, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .signup-link a {
            color: #2a5298;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #1e3c72;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 6px;
            display: none;
            padding: 8px 12px;
            background-color: #fadbd8;
            border-radius: 5px;
            border-left: 4px solid #e74c3c;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #28a745;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #ccc;
            font-size: 13px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #2a5298;
            background: #f5f5f5;
        }

        .qr-scanner {
            text-align: center;
        }

        .qr-info {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .qr-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                max-width: 100%;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .form-container {
                padding: 30px 20px;
            }

            .tab-navigation {
                margin-bottom: 25px;
            }

            .tab-btn {
                font-size: 11px;
                padding: 12px 8px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .radio-group {
                flex-direction: column;
                gap: 12px;
            }

            .social-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="header">
                <h1>🎪 EVENT HQ</h1>
                <p>Your Event Management Platform</p>
            </div>

            <div class="form-container">
                <div class="success-message" id="successMessage"></div>

                <!-- Tab Navigation -->
                <div class="tab-navigation">
                    <button class="tab-btn active" onclick="switchTab('attendee')">Attendee</button>
                    <button class="tab-btn" onclick="switchTab('organizer')">Organizer</button>
                    <button class="tab-btn" onclick="switchTab('qrcode')">QR Check-In</button>
                </div>

                <!-- ===== ATTENDEE LOGIN ===== -->
                <div class="tab-pane active" id="attendee">
                    <form onsubmit="handleAttendeeLogin(event)">
                        <div class="form-group">
                            <label for="attendeeEmail">Email Address</label>
                            <input type="email" id="attendeeEmail" name="attendeeEmail" 
                                   placeholder="your@email.com" required>
                            <div class="error-message" id="attendeeEmailError"></div>
                        </div>

                        <div class="form-group">
                            <label for="attendeePassword">Password</label>
                            <input type="password" id="attendeePassword" name="attendeePassword" 
                                   placeholder="Enter your password" required>
                            <div class="error-message" id="attendeePasswordError"></div>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="rememberAttendee" name="rememberAttendee">
                            <label for="rememberAttendee">Remember me</label>
                        </div>

                        <div class="forgot-password">
                            <a href="#reset">Forgot password?</a>
                        </div>

                        <button type="submit" class="login-btn">Login</button>

                        <div class="divider">OR</div>

                        <div class="social-buttons">
                            <button type="button" class="social-btn" onclick="handleSocialLogin('google')">
                                🔵 Google
                            </button>
                            <button type="button" class="social-btn" onclick="handleSocialLogin('facebook')">
                                👥 Facebook
                            </button>
                        </div>

                        <div class="signup-link">
                            New here? <a href="#register">Register for an event</a>
                        </div>
                    </form>
                </div>

                <!-- ===== ORGANIZER LOGIN ===== -->
                <div class="tab-pane" id="organizer">
                    <form onsubmit="handleOrganizerLogin(event)">
                        <div class="form-group">
                            <label for="organizerEmail">Email Address</label>
                            <input type="email" id="organizerEmail" name="organizerEmail" 
                                   placeholder="organizer@email.com" required>
                            <div class="error-message" id="organizerEmailError"></div>
                        </div>

                        <div class="form-group">
                            <label for="organizerPassword">Password</label>
                            <input type="password" id="organizerPassword" name="organizerPassword" 
                                   placeholder="Enter your password" required>
                            <div class="error-message" id="organizerPasswordError"></div>
                        </div>

                        <div class="form-group">
                            <label for="organizerCompany">Company/Organization</label>
                            <input type="text" id="organizerCompany" name="organizerCompany" 
                                   placeholder="Your organization name" required>
                            <div class="error-message" id="organizerCompanyError"></div>
                        </div>

                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="twoFAYes" name="twoFA" value="yes" required>
                                <label for="twoFAYes">2FA Enabled</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="twoFANo" name="twoFA" value="no">
                                <label for="twoFANo">2FA Disabled</label>
                            </div>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="rememberOrganizer" name="rememberOrganizer">
                            <label for="rememberOrganizer">Remember me</label>
                        </div>

                        <div class="forgot-password">
                            <a href="#reset">Forgot password?</a>
                        </div>

                        <button type="submit" class="login-btn">Login</button>

                        <div class="signup-link">
                            Want to organize? <a href="#register-org">Create account</a>
                        </div>
                    </form>
                </div>

                <!-- ===== QR CODE CHECK-IN ===== -->
                <div class="tab-pane" id="qrcode">
                    <div class="qr-info">
                        <div class="qr-icon">📱</div>
                        <h3 style="margin: 10px 0; color: #333;">Quick Check-In</h3>
                        <p>Scan your event QR code to check in instantly. No password needed!</p>
                    </div>

                    <form onsubmit="handleQRCheckIn(event)">
                        <div class="form-group">
                            <label for="qrCode">Scan Event QR Code</label>
                            <input type="text" id="qrCode" name="qrCode" 
                                   placeholder="Scan QR code here..." required autofocus>
                            <div class="error-message" id="qrCodeError"></div>
                        </div>

                        <div class="form-group">
                            <label for="attendeeName">Your Name</label>
                            <input type="text" id="attendeeName" name="attendeeName" 
                                   placeholder="Enter your full name" required>
                            <div class="error-message" id="attendeeNameError"></div>
                        </div>

                        <div class="form-group">
                            <label for="attendeePhone">Phone Number</label>
                            <input type="tel" id="attendeePhone" name="attendeePhone" 
                                   placeholder="+1 (555) 123-4567" required>
                            <div class="error-message" id="attendeePhoneError"></div>
                        </div>

                        <button type="submit" class="login-btn">Check In Now</button>

                        <div class="qr-info" style="margin-top: 20px; background: #e8f4f8; color: #006699;">
                            <p style="font-size: 12px; margin: 0;">
                                💡 Tip: Ask the event staff for the QR code if you don't have it
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab Switching
        function switchTab(tabName) {
            // Hide all tabs
            const panes = document.querySelectorAll('.tab-pane');
            panes.forEach(pane => pane.classList.remove('active'));

            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Show selected tab and mark button as active
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Clear errors when switching tabs
            clearAllErrors();
        }

        // ===== ATTENDEE LOGIN =====
        function handleAttendeeLogin(e) {
            e.preventDefault();
            const email = document.getElementById('attendeeEmail').value.trim();
            const password = document.getElementById('attendeePassword').value;

            clearErrors(['attendeeEmailError', 'attendeePasswordError']);

            let isValid = true;

            if (!email || !isValidEmail(email)) {
                showError('attendeeEmailError', 'Enter a valid email address');
                isValid = false;
            }

            if (!password || password.length < 6) {
                showError('attendeePasswordError', 'Password must be at least 6 characters');
                isValid = false;
            }

            if (isValid) {
                showSuccess('✓ Login successful! Redirecting to your events...');
                setTimeout(() => {
                    alert('Welcome! Redirecting to dashboard...');
                    // window.location.href = '/attendee-dashboard';
                }, 1500);
            }
        }

        // ===== ORGANIZER LOGIN =====
        function handleOrganizerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('organizerEmail').value.trim();
            const password = document.getElementById('organizerPassword').value;
            const company = document.getElementById('organizerCompany').value.trim();

            clearErrors(['organizerEmailError', 'organizerPasswordError', 'organizerCompanyError']);

            let isValid = true;

            if (!email || !isValidEmail(email)) {
                showError('organizerEmailError', 'Enter a valid email address');
                isValid = false;
            }

            if (!password || password.length < 8) {
                showError('organizerPasswordError', 'Password must be at least 8 characters');
                isValid = false;
            }

            if (!company || company.length < 3) {
                showError('organizerCompanyError', 'Organization name must be at least 3 characters');
                isValid = false;
            }

            if (isValid) {
                showSuccess('✓ Organizer login successful! Redirecting to control panel...');
                setTimeout(() => {
                    alert('Welcome back, Organizer!');
                    // window.location.href = '/organizer-dashboard';
                }, 1500);
            }
        }

        // ===== QR CHECK-IN =====
        function handleQRCheckIn(e) {
            e.preventDefault();
            const qrCode = document.getElementById('qrCode').value.trim();
            const name = document.getElementById('attendeeName').value.trim();
            const phone = document.getElementById('attendeePhone').value.trim();

            clearErrors(['qrCodeError', 'attendeeNameError', 'attendeePhoneError']);

            let isValid = true;

            if (!qrCode || qrCode.length < 5) {
                showError('qrCodeError', 'Invalid QR code format');
                isValid = false;
            }

            if (!name || name.length < 3) {
                showError('attendeeNameError', 'Enter your full name');
                isValid = false;
            }

            if (!phone || !isValidPhone(phone)) {
                showError('attendeePhoneError', 'Enter a valid phone number');
                isValid = false;
            }

            if (isValid) {
                showSuccess('✓ Check-in successful! Welcome to the event!');
                setTimeout(() => {
                    alert('You have been checked in! Enjoy the event!');
                    // Reset form
                    document.querySelector('#qrcode form').reset();
                    document.getElementById('qrCode').focus();
                }, 1500);
            }
        }

        // ===== SOCIAL LOGIN =====
        function handleSocialLogin(provider) {
            const providerName = provider.charAt(0).toUpperCase() + provider.slice(1);
            showSuccess(`⏳ Logging in with ${providerName}...`);
            setTimeout(() => {
                alert(`Redirecting to ${providerName} login...`);
                // window.location.href = `/auth/${provider}`;
            }, 1000);
        }

        // ===== VALIDATION HELPERS =====
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function isValidPhone(phone) {
            const phoneRegex = /^[\d\s\-\(\)\+]+{10,}$/;
            return phoneRegex.test(phone.replace(/\s/g, ''));
        }

        // ===== ERROR & SUCCESS HANDLERS =====
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = '❌ ' + message;
                errorElement.classList.add('show');
            }
        }

        function clearErrors(errorIds) {
            errorIds.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.textContent = '';
                    element.classList.remove('show');
                }
            });
        }

        function clearAllErrors() {
            const allErrors = document.querySelectorAll('.error-message');
            allErrors.forEach(error => {
                error.textContent = '';
                error.classList.remove('show');
            });
        }

        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.classList.add('show');
            setTimeout(() => {
                successElement.classList.remove('show');
            }, 4000);
        }

        // ===== REMEMBER ME =====
        window.addEventListener('load', () => {
            if (localStorage.getItem('rememberAttendee')) {
                document.getElementById('rememberAttendee').checked = true;
            }
            if (localStorage.getItem('rememberOrganizer')) {
                document.getElementById('rememberOrganizer').checked = true;
            }
        });

        // Auto-focus QR input on QR tab switch
        document.addEventListener('click', function(e) {
            if (e.target.textContent.includes('QR')) {
                setTimeout(() => document.getElementById('qrCode').focus(), 100);
            }
        });
    </script>
</body>
</html>
